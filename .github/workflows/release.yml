name: Release

# Publica una versión cuando se empuja una etiqueta vX.Y.Z.
# La app consulta esta release para avisar de actualizaciones.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: SQLite para las pruebas
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: Dependencias
        run: flutter pub get

      - name: Generar código (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analizar
        run: flutter analyze

      - name: Probar
        run: flutter test --timeout 90s

      - name: Comprobar que la etiqueta coincide con pubspec
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "etiqueta=$TAG pubspec=$PUBSPEC"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $PUBSPEC de pubspec.yaml" >&2
            exit 1
          fi

      # La firma debe ser siempre la misma o Android rechaza la actualización.
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secret KEYSTORE_BASE64: no se puede publicar un APK actualizable." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/seguimiento.jks
          cat > android/key.properties <<EOF
          storeFile=seguimiento.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar APK
        run: flutter build apk --release --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/seguimiento-${GITHUB_REF_NAME}.apk"

      - name: Borrar la llave del runner
        if: always()
        run: rm -f android/seguimiento.jks android/key.properties

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
