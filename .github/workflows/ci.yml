name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # Las pruebas abren SQLite del sistema (ver test/support/sqlite_host.dart).
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # El release se queda sin red si este permiso falta (Flutter solo lo
      # añade en debug), y el fallo no aparece en ninguna prueba.
      - name: Permiso de internet declarado
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - run: flutter analyze
      # El timeout evita que una prueba colgada queme 10 minutos de runner.
      - run: flutter test --timeout 90s
