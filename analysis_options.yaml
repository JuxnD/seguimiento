include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
  errors:
    # `weekday => integer()` es la forma idiomática de drift para declarar
    # columnas; el analizador lo lee como getter recursivo.
    recursive_getters: ignore

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_dynamic_calls
    - prefer_final_locals
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously
