name: seguimiento
description: "Seguimiento de entrenamiento, comidas y medidas con informe semanal en Markdown."
publish_to: 'none'
version: 1.21.0+29

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # ZIP portable de base + fotos. Fijado para Dart 3.4 / Flutter 3.22.
  archive: 3.6.1
  crypto: ^3.0.7
  # Reloj reemplazable: el cronómetro lo usa para que las pruebas controlen el tiempo.
  clock: ^1.1.1
  drift: ">=2.19.2 <2.23.0"
  file_picker: ">=8.0.0 <9.0.0"
  # 0.70+ usa APIs de Flutter 3.27 (Color.a): no compila con 3.22 aunque pub lo resuelva.
  fl_chart: ">=0.68.0 <0.70.0"
  flutter:
    sdk: flutter
  flutter_local_notifications: ">=17.0.0 <18.0.0"
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_timezone: ">=3.0.0 <4.0.0"
  http: ">=1.2.0 <2.0.0"
  image_picker: ">=1.1.0 <2.0.0"
  package_info_plus: ">=8.0.0 <9.0.0"
  path: ^1.9.0
  path_provider: ^2.1.5
  # 11+ exige el plugin de Gradle de Flutter nuevo: no compila con 3.22.
  share_plus: 10.1.4
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.42
  timezone: ">=0.9.0 <0.10.0"
  url_launcher: ">=6.2.0 <6.4.0"
  wakelock_plus: ^1.3.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Solo para simular el wakelock en las pruebas del cronómetro.
  wakelock_plus_platform_interface: ">=1.2.0 <2.0.0"
  drift_dev: ">=2.19.0 <2.23.0"
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    # Ilustraciones de técnica; se regeneran con `python tool/figuras.py`.
    - assets/tecnica/figuras.json
    # Maniquí 3D (por ahora tres ejercicios); `python tool/figuras3d.py`.
    - assets/tecnica/figuras3d.json
